<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ZYVORA — Everything Around You, Connected</title>
<meta name="theme-color" content="#0b1550"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><script>(function(){var s=function(m){var d=document.createElement('pre');d.style.cssText='white-space:pre-wrap;padding:14px;margin:10px;background:#fff;color:#b00020;border-radius:12px;font:13px monospace;position:relative;z-index:99';d.textContent='ত্রুটি (স্ক্রিনশট পাঠান):\n'+m;document.body.prepend(d)};
addEventListener('error',function(x){s(x.target&&x.target.src?'ফাইল লোড হয়নি: '+x.target.src:(x.message+' @'+(x.filename||'').split('/').pop()+':'+x.lineno))},true);
addEventListener('unhandledrejection',function(x){s('Promise: '+(x.reason&&x.reason.message||x.reason))})})()</script><div id="app"></div><div id="modal"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script src="core.js"></script>
<script>
const S={tab:'home',k:'',q:'',all:false,mode:'login',me:null,user:null,off:null,shell:null},U=()=>S.user,uid=()=>S.me.uid;
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
let dip;addEventListener('beforeinstallprompt',x=>{x.preventDefault();dip=x});
const install=()=>dip?dip.prompt():modal('<h3>ফোনে ইনস্টল</h3><br><p>Android Chrome: ⋮ মেনু → "Install app" / "Add to Home screen"।<br>iPhone Safari: Share → "Add to Home Screen"।</p><br><button class=btn onclick="close()">ঠিক আছে</button>');
auth.onAuthStateChanged(u=>{S.me=u;S.off&&S.off();S.user=null;
 if(u)S.off=db.collection('users').doc(u.uid).onSnapshot(s=>{S.user=s.exists?{id:s.id,name:'',phone:'',area:'',role:'user',banned:false,workerStatus:'none',free:false,ratingSum:0,ratingCount:0,complaints:0,...s.data()}:null;render()},err);else render()});
const go=(t,k='')=>{S.tab=t;S.k=k;if(t=='help'||t=='donate'||t=='blood'||t=='community'){S.k=t=='community'?'':t;S.tab='community'}render();scrollTo(0,0)};
function render(){const a=$('#app');
 if(!S.me){S.shell=null;return a.innerHTML=authView()}
 if(!S.me.emailVerified)return a.innerHTML=`<div class=center><div class=stack style="max-width:420px"><h2>ইমেইল ভেরিফাই করুন</h2><p><b>${e(S.me.email)}</b>-এ লিংক পাঠানো হয়েছে। লিংকে ক্লিক করে ফিরে এসে নিচের বাটন চাপুন।</p><button class=btn onclick="auth.currentUser.reload().then(()=>auth.currentUser.emailVerified?location.reload():toast('এখনও ভেরিফাই হয়নি'))">ভেরিফাই করেছি</button><button class="btn g" onclick="auth.currentUser.sendEmailVerification().then(()=>toast('আবার পাঠানো হয়েছে'))">আবার লিংক পাঠান</button><button class=lnk onclick="auth.signOut()">বের হন</button></div></div>`;
 if(!S.user)return a.innerHTML='<div class=center>লোড হচ্ছে…</div>';
 if(S.user.banned)return a.innerHTML=`<div class=center><div><h2>অ্যাকাউন্ট নিষিদ্ধ</h2><p>অভিযোগ বা কম রেটিংয়ের কারণে অ্যাডমিন আপনার অ্যাকাউন্ট বন্ধ করেছেন।</p><br><button class=btn onclick="auth.signOut()">বের হন</button></div></div>`;
 if(!S.user.name||!S.user.area||!/^01[3-9]\d{8}$/.test(S.user.phone))return a.innerHTML=`<div class=auth><div class=abox><h2 style="margin-bottom:12px">প্রোফাইল সম্পূর্ণ করুন</h2><label>পুরো নাম</label><input id=n value="${e(S.user.name)}"><label>মোবাইল নম্বর</label><input id=ph inputmode=tel placeholder="01XXXXXXXXX" value="${e(S.user.phone)}"><label>আপনার এলাকা</label><input id=ar value="${e(S.user.area)}"><button class="btn p" style="width:100%" onclick="fillP()">সংরক্ষণ করুন</button><p style="text-align:center;margin-top:12px"><button class=lnk onclick="auth.signOut()">বের হন</button></p></div></div>`;
 if(S.shell!==uid()||!$('#main')){S.shell=uid();a.innerHTML=`<header class=top><div class=row1><span class=brand><img src="icon-192.png" alt="">ZYVORA</span><button class=av onclick="go('profile')" aria-label="প্রোফাইল">${e(U().name[0])}</button></div><div class=row2><button class=chip onclick="chArea()">📍 <span id=ar></span> ▾</button><span class=vf>✔ ভেরিফাইড অ্যাকাউন্ট</span></div><input id=sq class=search placeholder="আপনার আশেপাশে যেকোনো কিছু খুঁজুন…" onkeydown="if(event.key=='Enter'){S.q=this.value.trim();go('market')}"></header><main id=main></main><nav id=nav></nav>`}
 $('#ar').textContent=U().area;
 const T=[['home','🏠','হোম'],['market','🛍️','বাজার'],['create','＋','তৈরি'],['community','👥','কমিউনিটি'],['profile','👤','প্রোফাইল']];
 $('#nav').innerHTML=T.map(t=>t[0]=='create'?`<button class=plus onclick="createSheet()"><i>＋</i>তৈরি</button>`:`<button class="${S.tab==t[0]?'on':''}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}</button>`).join('');
 ({home,market,errands,jobs,community,guides,profile})[S.tab]()}
function authView(){const r=S.mode=='reg';return `<div class=auth><div class=abox><img src="logo.jpg" alt="ZYVORA"><h2 style="margin-bottom:12px">${r?'নতুন অ্যাকাউন্ট':'লগইন'}</h2>
${r?'<label>পুরো নাম</label><input id=n><label>মোবাইল নম্বর</label><input id=ph inputmode=tel placeholder="01XXXXXXXXX"><label>আপনার এলাকা (থানা/ওয়ার্ড/পাড়া)</label><input id=ar placeholder="যেমন: রংপুর সদর">':''}
<label>ইমেইল</label><input id=em type=email><label>পাসওয়ার্ড</label><input id=pw type=password><button class="btn p" style="width:100%;padding:13px" onclick="${r?'reg()':'login()'}">${r?'অ্যাকাউন্ট খুলুন':'প্রবেশ করুন'}</button>
<p style="margin-top:14px;text-align:center">${r?'আগেই অ্যাকাউন্ট আছে?':'নতুন?'} <button class=lnk style="color:var(--b);font-weight:600" onclick="S.mode='${r?'login':'reg'}';render()">${r?'লগইন':'রেজিস্ট্রেশন'}</button></p></div></div>`}
const login=()=>auth.signInWithEmailAndPassword(v('em'),v('pw')).catch(err);
async function reg(){const n=v('n'),ph=v('ph'),ar=v('ar').replace(/\s+/g,' ');
 if(n.length<3||!/^01[3-9]\d{8}$/.test(ph)||ar.length<2||!v('em')||v('pw').length<6)return toast('সব তথ্য সঠিকভাবে দিন (মোবাইল: 01XXXXXXXXX)');
 try{const c=await auth.createUserWithEmailAndPassword(v('em'),v('pw'));
 await db.collection('users').doc(c.user.uid).set({name:n,phone:ph,area:ar,role:'user',banned:false,workerStatus:'none',free:false,ratingSum:0,ratingCount:0,complaints:0,createdAt:TS()});
 await c.user.sendEmailVerification()}catch(x){err(x)}}
function fillP(){const n=v('n'),p=v('ph'),a=v('ar').replace(/\s+/g,' ');if(n.length<3||!/^01[3-9]\d{8}$/.test(p)||a.length<2)return toast('নাম, মোবাইল (01XXXXXXXXX) ও এলাকা দিন');db.collection('users').doc(uid()).update({name:n,phone:p,area:a}).catch(err)}
const chArea=()=>{const a=(prompt('আপনার এলাকা লিখুন',U().area)||'').replace(/\s+/g,' ').trim();a.length>1&&db.collection('users').doc(uid()).update({area:a}).then(()=>toast('এলাকা বদলানো হয়েছে'))};
const ph1=(a,i)=>`<div class=ph>${a?.length?`<img src="${safe(a[0])}" alt="">`:i}</div>`;
const pcard=p=>`<div class=card onclick="pView('${p.id}')" style="cursor:pointer">${ph1(p.imgs,'🛍️')}<b>${e(p.title)}</b><span class=price>৳${bn(p.price)}</span><span class=meta>${e(p.area)} · ${ago(p.createdAt)}</span></div>`;
const kinds={problem:['এলাকার সমস্যা',''],help:['সাহায্য দরকার','p'],donate:['দান করছি','o'],bneed:['রক্ত দরকার','b'],bgive:['রক্ত দিতে চাই','o']};
const postCard=p=>`<div class="card ${p.kind=='bneed'?'warn':''}"><div class=row><span class="tag ${kinds[p.kind][1]}">${kinds[p.kind][0]}</span>${p.blood?`<b>${e(p.blood)}</b>`:''}<span class=meta>${e(p.byName)} · ${e(p.area)} · ${ago(p.createdAt)}</span></div>${gal(p.imgs)}<p>${e(p.text)}</p><div class=row><button class="btn s ${(p.supports||[]).includes(uid())?'':'g'}" onclick="support('${p.id}')">👍 সমর্থন ${bn((p.supports||[]).length)}</button>${p.kind!='problem'?`<button class="btn s" onclick="contact('${p.byId}')">যোগাযোগ</button>`:''}<button class=lnk onclick="reportForm('post','${p.id}','${p.byId}')">রিপোর্ট</button></div></div>`;
/* HOME */
async function home(){const m=$('#main'),T=[['market','🛍️','Shop','কেনাকাটা','#efe9ff'],['errands','📦','Delivery','ফরমাশ','#fff0e0'],['help','🤝','Helper','সহায়তা','#e3f8ee'],['jobs','💼','Jobs','চাকরি','#e4efff'],['community','👥','Community','কমিউনিটি','#e4f3ff'],['donate','🎁','Donate','দান','#ffe9f2'],['blood','🩸','Blood','রক্তদান','#ffe4e4'],['guides','📍','Explore','গাইড','#e2f6fb']];
 m.innerHTML=`<section class=hero><h2>আপনার এলাকার সবকিছু এখন এক জায়গায়!</h2><p>কেনাবেচা, কাজ, সেবা, সাহায্য এবং আরও অনেক কিছু</p><button class=btn onclick="createSheet()">এখনই ব্যবহার করুন →</button></section><div class=cats>${T.map(t=>`<div class=cat style="background:${t[4]}" onclick="go('${t[0]}')"><i>${t[1]}</i>${t[2]}<small>${t[3]}</small></div>`).join('')}</div><div class=sec><h3>🔥 আপনার এলাকার পণ্য</h3><button class=lnk style="color:var(--b)" onclick="go('market')">সব দেখুন →</button></div><div id=hp class=strip></div><div class=sec><h3>📢 এলাকার আপডেট</h3><button class=lnk style="color:var(--b)" onclick="go('community')">সব দেখুন →</button></div><div id=hu class=grid></div><div class=blood><div><h3>রক্ত দিন, জীবন বাঁচান</h3><p style="opacity:.85">আপনার রক্তই কারও জীবনের আশা</p></div><button class=btn onclick="go('blood')">রক্তদাতা হোন →</button></div>`;
 try{const a=U().area,p=docs(await db.collection('products').where('status','==','approved').where('area','==',a).limit(10).get()),u=docs(await db.collection('posts').where('area','==',a).limit(6).get());
 $('#hp').innerHTML=p.length?p.map(pcard).join(''):'<div class=empty style="width:100%">এই এলাকায় এখনও পণ্য নেই। প্রথম পণ্যটি আপনিই দিন।</div>';$('#hu').innerHTML=u.length?u.map(postCard).join(''):'<div class=empty>এলাকার সমস্যা বা সাহায্যের কথা এখানে লিখুন।</div>'}catch(x){err(x)}}
/* MARKET */
async function market(){const m=$('#main');
 m.innerHTML=`<div class=sec><h2>বাজার ${S.q?`<span class=tag>"${e(S.q)}" <a href=# onclick="S.q='';$('#sq').value='';market();return false">✕</a></span>`:''}</h2><div class=row><label><input type=checkbox style="width:auto;margin:0 4px" ${S.all?'checked':''} onchange="S.all=this.checked;market()">সব এলাকা</label><button class="btn p" onclick="sellForm()">+ পণ্য বিক্রি</button></div></div><div id=l class=grid>লোড হচ্ছে…</div>`;
 try{let q=db.collection('products').where('status','==','approved');if(!S.all)q=q.where('area','==',U().area);let d=docs(await q.limit(100).get());
 if(S.q)d=d.filter(p=>(p.title+p.desc).toLowerCase().includes(S.q.toLowerCase()));
 $('#l').innerHTML=d.length?d.map(pcard).join(''):'<div class=empty>কোনো পণ্য পাওয়া যায়নি।</div>'}catch(x){err(x)}}
async function pView(id){const s=await db.collection('products').doc(id).get(),p=s.data();modal(`${gal(p.imgs)}<h3 style="margin-top:12px">${e(p.title)}</h3><span class=price>৳${bn(p.price)}</span><p>${e(p.desc)}</p><p class=meta>${e(p.sellerName)} · ${e(p.area)} · ${ago(p.createdAt)}</p><div class=row><button class="btn p" onclick="contact('${p.sellerId}')">বিক্রেতার নম্বর</button><button class=lnk onclick="reportForm('product','${id}','${p.sellerId}')">রিপোর্ট</button><button class="btn g s" onclick="close()">বন্ধ</button></div>`)}
const imgIn=(n)=>`<label>ছবি (সর্বোচ্চ ${bn(n)}টি)</label><input id=im type=file accept="image/*" multiple onchange="thumbs(this,'pv')"><div id=pv class=pv></div>`;
const sellForm=()=>modal(`<h3>পণ্য বিক্রি</h3><br><label>পণ্যের নাম</label><input id=t><label>দাম (৳)</label><input id=pr type=number min=1><label>বর্ণনা (অবস্থা, কতদিনের পুরনো ইত্যাদি)</label><textarea id=d rows=3></textarea>${imgIn(4)}<p class=meta>পোস্ট স্বয়ংক্রিয়ভাবে যাচাই হবে। সন্দেহজনক হলে অ্যাডমিন দেখবেন।</p><br><button class="btn p" onclick="sell()">জমা দিন</button> <button class="btn g" onclick="close()">বাতিল</button>`);
async function sell(){const t=v('t'),d=v('d'),p=+v('pr');if(t.length<3||!p)return toast('নাম ও দাম দিন');const im=await pick('im',4);if(!im.length)return toast('কমপক্ষে ১টি ছবি দিন');if(tooBig([im]))return;
 const f=autoReview(t,d,p);try{await db.collection('products').add({title:t,desc:d,price:p,imgs:im,area:U().area,sellerId:uid(),sellerName:U().name,status:f.length?'flagged':'approved',flags:f,createdAt:TS()});close();toast(f.length?'অ্যাডমিন রিভিউয়ের জন্য পাঠানো হয়েছে':'পণ্য প্রকাশিত হয়েছে ✓');render()}catch(x){err(x)}}
async function contact(id){const s=await db.collection('users').doc(id).get();modal(`<h3>${e(s.data().name)}</h3><p style="font-size:24px;margin:10px 0"><a href="tel:${e(s.data().phone)}">${e(s.data().phone)}</a></p><p class=meta>দেখা করার আগে যাচাই করুন। হয়রানি হলে রিপোর্ট করুন।</p><br><button class=btn onclick="close()">ঠিক আছে</button>`)}
const reportForm=(t,id,u)=>modal(`<h3>রিপোর্ট করুন</h3><br><label>কারণ</label><select id=rs><option>ভুয়া/প্রতারণা</option><option>হয়রানি</option><option>আপত্তিকর বিষয়বস্তু</option><option>অন্য</option></select><textarea id=rd rows=3 placeholder="বিস্তারিত"></textarea><button class="btn r" onclick="report('${t}','${id}','${u}')">রিপোর্ট পাঠান</button>`);
async function report(type,id,target){try{await db.collection('reports').add({type,targetId:id,targetUid:target,reason:v('rs'),detail:v('rd'),byId:uid(),byName:U().name,createdAt:TS()});await db.collection('users').doc(target).update({complaints:FV.increment(1)});close();toast('রিপোর্ট জমা হয়েছে')}catch(x){err(x)}}
/* CREATE */
const createSheet=()=>modal(`<h3>কী করতে চান?</h3><br><div class=stack><button class="btn p" onclick="sellForm()">🛍️ পণ্য বিক্রি করুন</button><button class=btn onclick="errForm()">📦 ফরমাশ দিন (কিছু আনাতে/করাতে)</button><button class=btn onclick="postForm()">📝 সমস্যা / সাহায্য / দান / রক্ত — পোস্ট</button></div>`);
/* ERRANDS */
const km=(a,b,c,d)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742*Math.asin(Math.sqrt(h))};
const ecard=(x,b)=>`<div class=card><span class=price>৳${bn(x.pay)}</span><h3>${e(x.title)}</h3>${gal(x.imgs)}<p>${e(x.desc)}</p><div class=meta>${e(x.byName)} · ${e(x.area)}${x.dist!=null?' · '+bn(x.dist.toFixed(1))+' কিমি দূরে':''} · ${ago(x.createdAt)}</div><div class=row>${b}</div></div>`;
async function errands(){const m=$('#main');m.innerHTML=`<div class=sec><h2>📦 আমার ফরমাশ</h2><button class="btn p" onclick="errForm()">+ ফরমাশ দিন</button></div><div id=mine class=grid>লোড হচ্ছে…</div>`;
 try{const mine=docs(await db.collection('errands').where('byId','==',uid()).get());
 $('#mine').innerHTML=mine.length?mine.map(x=>ecard(x,`<span class="tag ${x.status=='done'?'o':x.status=='taken'?'p':''}">${{open:'অপেক্ষমাণ',taken:'নিয়েছেন: '+e(x.workerName),done:'সম্পন্ন'}[x.status]}</span>${x.status=='taken'?`<button class="btn s" onclick="rateForm('${x.id}','${x.workerId}')">সম্পন্ন ও রেটিং</button>`:''}`)).join(''):'<div class=empty>কিছু আনাতে চান? ফরমাশ দিন, কাছের কর্মী নিয়ে নেবেন।</div>'}catch(x){err(x)}}
const errForm=()=>modal(`<h3>ফরমাশ দিন</h3><br><label>কী আনতে/করতে হবে</label><input id=t placeholder="যেমন: ফার্মেসি থেকে ওষুধ আনা"><label>বিস্তারিত</label><textarea id=d rows=3></textarea><label>মজুরি (৳)</label><input id=pr type=number min=10>${imgIn(3)}<button class="btn p" onclick="errPost()">পোস্ট করুন</button>`);
async function errPost(){const t=v('t'),p=+v('pr');if(t.length<4||!p)return toast('কাজ ও মজুরি দিন');const im=await pick('im',3);if(tooBig([im]))return;
 const go2=async(lat,lng)=>{try{await db.collection('errands').add({title:t,desc:v('d'),pay:p,imgs:im,area:U().area,byId:uid(),byName:U().name,status:'open',lat:lat??null,lng:lng??null,createdAt:TS()});close();toast('ফরমাশ পোস্ট হয়েছে');go('errands')}catch(x){err(x)}};
 navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>go2(p.coords.latitude,p.coords.longitude),()=>go2(),{timeout:4000}):go2()}
const rateForm=(id,w)=>modal(`<h3>কাজ কেমন হয়েছে?</h3><br><select id=rt><option value=5>৫ — চমৎকার</option><option value=4>৪ — ভালো</option><option value=3>৩ — মোটামুটি</option><option value=2>২ — খারাপ</option><option value=1>১ — হয়রানি/প্রতারণা</option></select><textarea id=rv rows=3 placeholder="মতামত"></textarea><button class="btn p" onclick="rate('${id}','${w}')">জমা দিন</button>`);
async function rate(id,w){const r=+v('rt');try{await db.collection('errands').doc(id).update({status:'done'});await db.collection('reviews').add({workerId:w,errandId:id,byId:uid(),byName:U().name,rating:r,text:v('rv'),createdAt:TS()});await db.collection('users').doc(w).update({ratingSum:FV.increment(r),ratingCount:FV.increment(1)});close();toast('ধন্যবাদ ✓');errands()}catch(x){err(x)}}
/* JOBS (কর্মী) */
async function jobs(){const m=$('#main'),u=U(),st=u.workerStatus;
 if(st=='none'||st=='rejected')return m.innerHTML=`<div class=sec><h2>💼 পার্ট-টাইম কাজ</h2></div><div class=card><h3>নিজের এলাকায় কাজ করুন</h3><p>ডেলিভারি, ফরমাশ খাটা বা ট্যুরিস্ট গাইড — নিজের এলাকার মানুষের কাজ করে আয় করুন। নিরাপত্তার জন্য NID ও ছবি যাচাই বাধ্যতামূলক।</p>${st=='rejected'?'<span class="tag x">আগের আবেদন বাতিল হয়েছে। সঠিক তথ্যে আবার আবেদন করুন।</span>':''}<div class=row><button class="btn p" onclick="workerForm()">কর্মী হিসেবে আবেদন করুন</button></div></div>`;
 if(st=='pending'){const w=(await db.collection('workers').doc(uid()).get()).data()||{};return m.innerHTML=`<div class=sec><h2>💼 আবেদন যাচাই চলছে</h2></div><div class=card><p>NID যাচাই: <span class="tag ${w.nidStatus=='approved'?'o':w.nidStatus=='rejected'?'x':'p'}">${{pending:'অপেক্ষমাণ',approved:'সঠিক ✓',rejected:'বাতিল'}[w.nidStatus]||'অপেক্ষমাণ'}</span></p><p>চূড়ান্ত অনুমোদন: <span class="tag p">অপেক্ষমাণ</span></p><p class=meta>অ্যাডমিন যাচাই শেষ করলে এখানে জানতে পারবেন।</p></div>`}
 m.innerHTML=`<div class=sec><h2>💼 কর্মী ড্যাশবোর্ড</h2></div><div class=card style="background:#e4efff;margin-bottom:16px"><div class=row><b>${e(u.workerType=='guide'?'ট্যুরিস্ট গাইড':'ডেলিভারি/ফরমাশ কর্মী')} ✓</b><button class="btn s ${u.free?'ok':'g'}" onclick="toggleFree()">${u.free?'● আমি এখন ফ্রি':'○ ব্যস্ত'}</button></div><span class=meta>ফ্রি থাকলে কাছের ফরমাশ আপনার তালিকায় আগে আসবে</span></div><h3>খোলা ফরমাশ (${e(u.area)})</h3><div id=open class=grid style="margin:10px 0 22px">লোড হচ্ছে…</div><h3>আমার নেওয়া কাজ</h3><div id=taken class=grid style="margin-top:10px"></div>`;
 try{const E=db.collection('errands');let o=docs(await E.where('status','==','open').where('area','==',u.area).get()).filter(x=>x.byId!=uid());
 o.forEach(x=>x.dist=u.lat&&x.lat?km(u.lat,u.lng,x.lat,x.lng):null);o.sort((a,b)=>(a.dist??99)-(b.dist??99));
 $('#open').innerHTML=o.length?o.map(x=>ecard(x,`<button class="btn s p" onclick="take('${x.id}')">আমি নিচ্ছি</button><button class=lnk onclick="reportForm('errand','${x.id}','${x.byId}')">রিপোর্ট</button>`)).join(''):'<div class=empty>এখন কোনো খোলা ফরমাশ নেই।</div>';
 const t=docs(await E.where('workerId','==',uid()).get()).filter(x=>x.status=='taken');$('#taken').innerHTML=t.length?t.map(x=>ecard(x,`<span class="tag p">চলমান</span><button class="btn s" onclick="contact('${x.byId}')">অর্ডারকারীর নম্বর</button>`)).join(''):'<div class=empty>চলমান কাজ নেই।</div>'}catch(x){err(x)}}
function toggleFree(){const f=!U().free,g=(a,b)=>db.collection('users').doc(uid()).update({free:f,lat:a??null,lng:b??null}).then(()=>{toast(f?'আপনি এখন ফ্রি':'ব্যস্ত দেখানো হচ্ছে')});
 f&&navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>g(p.coords.latitude,p.coords.longitude),()=>g(),{timeout:4000}):g()}
async function take(id){const r=db.collection('errands').doc(id);try{await db.runTransaction(async t=>{const s=await t.get(r);if(s.data().status!='open')throw'অন্য কেউ আগেই নিয়ে নিয়েছেন';t.update(r,{status:'taken',workerId:uid(),workerName:U().name})});toast('কাজটি আপনার ✓')}catch(x){toast(x.message||x)}jobs()}
const workerForm=()=>modal(`<h3>কর্মী আবেদন</h3><p class=meta>তথ্য ও ছবি শুধু অ্যাডমিন দেখবেন। ভুয়া তথ্য দিলে স্থায়ী নিষেধাজ্ঞা।</p><br><label>কাজের ধরন</label><select id=wt><option value=delivery>ডেলিভারি/ফরমাশ</option><option value=guide>ট্যুরিস্ট গাইড</option></select><label>পুরো নাম (NID অনুযায়ী)</label><input id=wn><label>NID নম্বর</label><input id=nid inputmode=numeric><label>জন্ম তারিখ</label><input id=dob type=date><label>স্থায়ী ঠিকানা</label><input id=ad><label>জরুরি যোগাযোগ (নাম ও নম্বর)</label><input id=em2><label>NID-এর সামনের ছবি *</label><input id=f1 type=file accept="image/*"><label>NID-এর পেছনের ছবি *</label><input id=f2 type=file accept="image/*"><label>NID হাতে নিজের ছবি (সেলফি)</label><input id=f3 type=file accept="image/*"><button class="btn p" onclick="applyW()">আবেদন জমা দিন</button>`);
async function applyW(){const n=v('nid').replace(/[০-৯]/g,c=>'০১২৩৪৫৬৭৮৯'.indexOf(c)).replace(/[\s-]/g,'');
 if(v('wn').length<3)return toast('NID অনুযায়ী পুরো নাম লিখুন');if(!/^\d+$/.test(n))return toast('NID নম্বরে শুধু সংখ্যা দিন');if(![10,13,17].includes(n.length))return toast('NID নম্বর ১০, ১৩ বা ১৭ সংখ্যার হতে হবে। আপনার দেওয়া: '+bn(n.length)+' সংখ্যা');if(!v('dob'))return toast('জন্ম তারিখ দিন');if(v('ad').length<5)return toast('স্থায়ী ঠিকানা লিখুন');if(v('em2').length<6)return toast('জরুরি যোগাযোগ লিখুন');
 if((Date.now()-new Date(v('dob')))/3.15576e10<18)return toast('বয়স কমপক্ষে ১৮ হতে হবে');if(!$('#f1').files[0]||!$('#f2').files[0])return toast('NID-এর দুই পাশের ছবি দিন');
 const [a]=await pick('f1',1,1000),[b]=await pick('f2',1,1000),c=$('#f3').files[0]?(await pick('f3',1,800))[0]:'';if(tooBig([a,b,c]))return;
 try{await db.collection('nid').doc(uid()).set({front:a,back:b,selfie:c});await db.collection('workers').doc(uid()).set({type:v('wt'),fullName:v('wn'),nid:n,dob:v('dob'),address:v('ad'),emergency:v('em2'),area:U().area,status:'pending',nidStatus:'pending',createdAt:TS()});await db.collection('users').doc(uid()).update({workerStatus:'pending',workerType:v('wt')});close();toast('আবেদন জমা হয়েছে। অ্যাডমিন যাচাই করবেন।')}catch(x){err(x)}}
/* COMMUNITY */
async function community(){const m=$('#main'),K=[['','সব'],['problem','সমস্যা'],['help','সাহায্য'],['donate','দান'],['blood','রক্তদান']];
 m.innerHTML=`<div class=sec><h2>👥 কমিউনিটি</h2><button class="btn p" onclick="postForm()">+ পোস্ট করুন</button></div><div class=sub>${K.map(k=>`<button class="${S.k==k[0]?'on':''}" onclick="S.k='${k[0]}';community()">${k[1]}</button>`).join('')}</div><div id=l class=grid>লোড হচ্ছে…</div>`;
 try{let d=docs(await db.collection('posts').where('area','==',U().area).limit(100).get());if(S.k)d=d.filter(p=>S.k=='blood'?p.kind[0]=='b':p.kind==S.k);
 $('#l').innerHTML=d.length?d.map(postCard).join(''):'<div class=empty>এখানে এখনও কিছু নেই। প্রথম পোস্টটি আপনিই দিন।</div>'}catch(x){err(x)}}
const postForm=()=>modal(`<h3>নতুন পোস্ট</h3><br><label>ধরন</label><select id=k onchange="$('#bg').style.display=this.value[0]=='b'?'block':'none'">${Object.entries(kinds).map(k=>`<option value=${k[0]}>${k[1][0]}</option>`).join('')}</select><div id=bg style="display:none"><label>রক্তের গ্রুপ</label><select id=bl>${['A+','A-','B+','B-','O+','O-','AB+','AB-'].map(x=>`<option>${x}</option>`).join('')}</select></div><label>বিস্তারিত</label><textarea id=tx rows=4></textarea>${imgIn(4)}<button class="btn p" onclick="post()">প্রকাশ করুন</button>`);
async function post(){const k=v('k'),t=v('tx');if(t.length<10)return toast('একটু বিস্তারিত লিখুন');const im=await pick('im',4);if(tooBig([im]))return;
 try{await db.collection('posts').add({kind:k,text:t,imgs:im,blood:k[0]=='b'?v('bl'):'',area:U().area,byId:uid(),byName:U().name,supports:[],createdAt:TS()});close();go('community')}catch(x){err(x)}}
const support=id=>db.collection('posts').doc(id).update({supports:FV.arrayUnion(uid())}).then(community).catch(err);
/* GUIDES */
async function guides(){const m=$('#main');m.innerHTML=`<div class=sec><h2>📍 এলাকা ঘুরে দেখুন — স্থানীয় গাইড</h2></div><p class=meta style="margin-bottom:12px">${e(U().area)} এলাকার যাচাইকৃত গাইড</p><div id=l class=grid>লোড হচ্ছে…</div>`;
 try{const d=docs(await db.collection('users').where('workerStatus','==','approved').where('area','==',U().area).get()).filter(x=>x.workerType=='guide'&&x.id!=uid());
 $('#l').innerHTML=d.length?d.map(g=>`<div class=card><h3>${e(g.name)} <span class="tag o">✓ NID যাচাইকৃত</span></h3><span class=meta>রেটিং ${bn(avg(g))} (${bn(g.ratingCount)})</span><div class=row><button class="btn s p" onclick="contact('${g.id}')">যোগাযোগ</button><button class=lnk onclick="reportForm('user','${g.id}','${g.id}')">রিপোর্ট</button></div></div>`).join(''):'<div class=empty>এই এলাকায় এখনও কোনো গাইড নেই। আপনি কাজ ট্যাবে গিয়ে গাইড হিসেবে আবেদন করতে পারেন।</div>'}catch(x){err(x)}}
/* PROFILE */
async function profile(){const u=U(),m=$('#main'),ws={none:'আবেদন করা হয়নি',pending:'যাচাই চলছে',approved:'অনুমোদিত ✓',rejected:'বাতিল'};
 m.innerHTML=`<div class=card><h2>${e(u.name)}</h2><p>${e(u.phone)} · ${e(S.me.email)} · 📍 ${e(u.area)}</p><div class=row><span class="tag ${u.workerStatus=='approved'?'o':'p'}">কর্মী: ${ws[u.workerStatus]}</span><span class=tag>রেটিং ${bn(avg(u))} (${bn(u.ratingCount)})</span></div><div class=row><button class="btn s" onclick="go('jobs')">💼 কর্মী/চাকরি</button><button class="btn s" onclick="go('errands')">📦 আমার ফরমাশ</button><button class="btn s g" onclick="install()">📲 ফোনে অ্যাপ ইনস্টল</button>${u.role=='admin'?'<a class="btn s r" href="admin.html" style="text-decoration:none">অ্যাডমিন প্যানেল</a>':''}<button class="btn s g" onclick="auth.signOut()">বের হন</button></div></div><div class=sec><h3>আমার পণ্য</h3></div><div id=l class=grid></div>`;
 const d=docs(await db.collection('products').where('sellerId','==',uid()).get());
 $('#l').innerHTML=d.length?d.map(p=>`<div class=card>${ph1(p.imgs,'🛍️')}<b>${e(p.title)}</b><span class=price>৳${bn(p.price)}</span><span class="tag ${p.status=='approved'?'o':p.status=='flagged'?'p':'x'}">${{approved:'প্রকাশিত',flagged:'রিভিউ চলছে',rejected:'বাতিল'}[p.status]}</span>${p.flags?.length?`<span class=meta>কারণ: ${e(p.flags.join(', '))}</span>`:''}</div>`).join(''):'<div class=empty>কোনো পণ্য নেই।</div>'}
</script></body></html>
