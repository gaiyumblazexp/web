<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAVYQO</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a1240;--blue:#1f4bff;--purple:#6a2cff;--bg:#f3f5ff;--card:#fff;--tx:#0a1240;--mut:#5b648f;--line:#e1e5fa;--grad:linear-gradient(135deg,#1f4bff,#6a2cff)}
[data-theme=dark]{--bg:#070b26;--card:#10173f;--tx:#eef0ff;--mut:#9aa3d6;--line:#222b63}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:16px/1.45 "Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
#app{max-width:480px;margin:auto;min-height:100%;position:relative;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hero{background:var(--grad);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 20px;border-radius:0 0 28px 28px}
.bar{display:flex;align-items:center;gap:10px}
.bar .sp{flex:1}
.ib{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.18);color:#fff;font-size:20px}
.chip{background:rgba(255,255,255,.18);color:#fff;border-radius:99px;padding:8px 14px}
h1{font-size:26px;margin:14px 0 2px}
.search{width:100%;margin-top:12px;padding:13px 16px;border-radius:99px;border:0;background:#fff;color:#0a1240}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:14px 12px}
.tile{background:var(--card);border-radius:16px;padding:10px 2px;font-size:12px;text-align:center;border:1px solid var(--line)}
.tile b{display:block;font-size:24px;font-weight:400}
.sec{padding:6px 16px}
.sec h2{font-size:18px;margin:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.card small{color:var(--mut)}
.tag{display:inline-block;background:var(--grad);color:#fff;border-radius:99px;font-size:12px;padding:1px 10px;margin-bottom:6px}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.btn{background:var(--grad);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;width:100%}
.btn.alt{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.row{display:flex;gap:8px;overflow-x:auto;padding:12px 16px}
.row button{white-space:nowrap;padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
.row button.on{background:var(--grad);color:#fff;border-color:transparent}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:8px 4px calc(8px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0}
nav button{font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;min-width:58px}
nav button.on{color:var(--blue);font-weight:700}
nav .plus{width:56px;height:56px;border-radius:50%;background:var(--grad);color:#fff;font-size:30px;margin-top:-26px;justify-content:center;box-shadow:0 6px 18px rgba(80,50,255,.45)}
.ov{position:fixed;inset:0;background:rgba(5,8,30,.55);z-index:9;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin-bottom:10px}
.sheet button.it{display:block;width:100%;text-align:left;padding:13px 8px;border-bottom:1px solid var(--line)}
.drawer{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:340px;background:var(--navy);color:#fff;z-index:10;padding:20px 14px;overflow:auto}
.drawer button{display:block;width:100%;text-align:left;color:#fff;padding:11px 8px;border-radius:12px}
.drawer button:hover{background:rgba(255,255,255,.1)}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:99px;z-index:20}
.auth{padding:40px 22px}
.err{color:#d7263d;font-size:14px;margin-top:8px}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pc>button.v{text-align:left;display:block;width:100%}
.pc .im{aspect-ratio:1;background:var(--line) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:42px}
.pc .bd{padding:8px 10px}
.pc .nm{font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.pc .pr{font-weight:700;color:var(--blue);font-size:17px}
.pc small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .add{margin:0 10px 10px;padding:8px;border-radius:10px;background:var(--grad);color:#fff;font-size:13px;font-weight:700}
.pc{position:relative}.hrt{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);color:#d7263d;font-size:18px}
.bub{max-width:78%;padding:9px 13px;border-radius:18px;margin:4px 0;word-wrap:break-word;width:fit-content}
.bub.me{margin-left:auto;background:var(--grad);color:#fff;border-bottom-right-radius:6px}
.bub.th{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.bub img{width:100%;border-radius:12px;display:block}
.qk{display:inline-block;margin:4px 6px 4px 0;padding:8px 14px;border-radius:99px;border:1px solid var(--blue);color:var(--blue)}
@media(prefers-reduced-motion:no-preference){.sheet,.drawer{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:0}}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { auth, db } from "./firebase.js";
import { onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, updateProfile, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import * as X from "./modules.js";
import { collection, query, where, getDocs, addDoc, doc, setDoc, getDoc, serverTimestamp, limit, updateDoc, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// type, icon, EN, BN  (no ride/transport type exists anywhere in the platform)
const TYPES = [
 ["product","🛍","Shop","পণ্য কিনুন"],["delivery","🛵","Delivery","ডেলিভারি"],["helper","🤝","Helper","সাহায্য নিন"],
 ["job","💼","Jobs","চাকরি"],["service","🛠","Services","সেবা"],["post","👥","Community","কমিউনিটি"],
 ["donation","💝","Donate","দান"],["blood","🩸","Blood","রক্তদান"],["lost","🔎","Lost & Found","হারানো-প্রাপ্তি"],["problem","📍","Local issues","স্থানীয় সমস্যা"]];
const CREATE = [["product","Sell product","পণ্য বিক্রি করুন"],["helper","Request helper","হেল্পার চান"],["job","Post job","চাকরি দিন"],["service","Offer service","সেবা দিন"],["post","Community post","কমিউনিটি পোস্ট"],["donation","Donation request","দানের অনুরোধ"],["problem","Report local problem","স্থানীয় সমস্যা জানান"]];
const L = {
 en:{hi:"Hello",tag:"Everything Around You, Connected.",search:"Search anything near you…",home:"Home",explore:"Explore",inbox:"Inbox",profile:"Profile",create:"Create",nearby:"Latest near you",none:"Nothing here yet. Be the first to post.",nonot:"No notifications yet.",login:"Log in",signup:"Create account",name:"Full name",email:"Email",pass:"Password (6+ characters)",area:"Area / city",title:"Title",desc:"Details",price:"Price or pay (optional)",publish:"Publish",cancel:"Cancel",published:"Published",out:"Log out",dark:"Dark mode",lang:"বাংলা",all:"All",mine:"My posts",verify:"Verify email to publish",menu:"Menu",loc:"Choose your area",ph:"Your area",about:"MAVYQO connects local people, shops, services and communities.",type:"Type",sent:"Verification email sent"},
 bn:{hi:"হ্যালো",tag:"আপনার চারপাশের সবকিছু, একসাথে।",search:"কাছাকাছি যেকোনো কিছু খুঁজুন…",home:"হোম",explore:"এক্সপ্লোর",inbox:"ইনবক্স",profile:"প্রোফাইল",create:"তৈরি",nearby:"আপনার কাছের সাম্প্রতিক",none:"এখনো কিছু নেই। প্রথম পোস্টটি আপনিই করুন।",nonot:"এখনো কোনো নোটিফিকেশন নেই।",login:"লগ ইন",signup:"অ্যাকাউন্ট খুলুন",name:"পুরো নাম",email:"ইমেইল",pass:"পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)",area:"এলাকা / শহর",title:"শিরোনাম",desc:"বিস্তারিত",price:"দাম বা মজুরি (ঐচ্ছিক)",publish:"প্রকাশ করুন",cancel:"বাতিল",published:"প্রকাশিত হয়েছে",out:"লগ আউট",dark:"ডার্ক মোড",lang:"English",all:"সব",mine:"আমার পোস্ট",verify:"পোস্ট করতে ইমেইল যাচাই করুন",menu:"মেনু",loc:"আপনার এলাকা বাছাই করুন",ph:"আপনার এলাকা",about:"MAVYQO স্থানীয় মানুষ, দোকান, সেবা ও কমিউনিটিকে এক জায়গায় যুক্ত করে।",type:"ধরন",sent:"যাচাইয়ের ইমেইল পাঠানো হয়েছে"}
};
const S = { tab:"home", filter:"all", lim:40, cat:"all", sort:"new", wish:new Set(), wishDocs:[], rev:{}, q:"", user:null, items:[], notes:[], lang:localStorage.lang||"en", theme:localStorage.theme||"light", area:localStorage.area||"Rangpur", authMode:"login", err:"", ov:null };
const t = k => L[S.lang][k] || k;
const tn = r => S.lang==="bn" ? r[3] : r[2];
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
const toast = m => { const d=document.createElement("div"); d.className="toast"; d.textContent=m; document.body.append(d); setTimeout(()=>d.remove(),2200); };

async function loadRev(o){ if(!o||S.rev[o]) return; try{ const q=await getDocs(query(collection(db,"reviews"),where("seller","==",o),limit(20))); const l=q.docs.map(d=>d.data()); S.rev[o]={n:l.length,avg:l.length?l.reduce((a,b)=>a+b.rating,0)/l.length:0,list:l.slice(0,3)}; render(); }catch{} }
async function load(){
  try{
    const s = await getDocs(query(collection(db,"listings"),where("status","==","active"),orderBy("createdAt","desc"),limit(S.lim)));
    S.items = s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    const w = await getDocs(collection(db,"users",S.user.uid,"wishlist")); S.wishDocs = w.docs.map(d=>({id:d.id,...d.data()})); S.wish = new Set(S.wishDocs.map(x=>x.id));
    const n = await getDocs(collection(db,"users",S.user.uid,"notifications"));
    S.notes = n.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){ toast(e.code||"Load failed"); }
  render();
}
const icon = ty => TYPES.find(x=>x[0]===ty)?.[1]||"•";
const label = ty => { const r=TYPES.find(x=>x[0]===ty); return r?tn(r):ty; };
const mineBtns = i => i.owner===S.user?.uid ? `<div style="margin-top:8px;display:flex;gap:8px"><button class="btn alt" data-a="edit" data-id="${i.id}">✏️ Edit</button><button class="btn alt" data-a="del" data-id="${i.id}">🗑 Delete</button></div>` : "";
const card = i => `<div class="card">${X.safeImg(i.img)?`<img src="${esc(X.tr(i.img,800))}" alt="" style="width:100%;border-radius:12px;margin-bottom:8px">`:""}<span class="tag">${icon(i.type)} ${esc(label(i.type))}</span><div><b>${esc(i.title)}</b></div><div>${esc(i.desc)}</div><small>📍 ${esc(i.area)}${i.price?` · ${esc(i.price)}`:""}</small>${mineBtns(i)}${i.owner&&i.owner!==S.user?.uid?`<div style="margin-top:8px"><button class="btn alt" data-a="x:chat:start" data-o="${esc(i.owner)}" data-n="${esc(i.ownerName)}" data-l="${i.id}" data-lt="${esc(i.title)}" data-li="${esc(i.img||"")}" data-lp="${esc(i.price||"")}">💬 Message</button></div>`:""}</div>`;
const byId = id => S.items.find(i=>i.id===id)||S.wishDocs.find(i=>i.id===id);
const pcard = i => `<div class="pc"><button class="hrt" data-a="wish" data-id="${i.id}" aria-label="Save">${S.wish.has(i.id)?"♥":"♡"}</button><button class="v" data-a="view" data-id="${i.id}"><div class="im" ${X.safeImg(i.img)?`style="background-image:url('${esc(X.tr(i.img,400))}')"`:""}>${X.safeImg(i.img)?"":"🛍"}</div><div class="bd"><div class="nm">${esc(i.title)}</div><div class="pr">${i.price?`৳${esc(i.price)}`:""}</div><small>📍 ${esc(i.area)}</small></div></button>${i.owner!==S.user?.uid&&parseFloat(i.price)>0?`<button class="add" data-a="x:market:add" data-id="${i.id}">🛒 ${S.lang==="bn"?"কার্টে যোগ":"Add to cart"}</button>`:""}</div>`;
const CATS=[["all","All","সব"],["electronics","📱 Electronics","📱 ইলেকট্রনিক্স"],["fashion","👕 Fashion","👕 ফ্যাশন"],["home","🏠 Home","🏠 ঘর"],["books","📚 Books","📚 বই"],["food","🍱 Food","🍱 খাবার"],["other","📦 Other","📦 অন্যান্য"]];
const SORTS=[["new","Newest","নতুন"],["asc","Price ↑","দাম ↑"],["desc","Price ↓","দাম ↓"]];
const pfilter = a => { let r=a.filter(i=>S.cat==="all"||(i.cat||"other")===S.cat); const p=i=>parseFloat(i.price)||0; if(S.sort==="asc") r=[...r].sort((x,y)=>p(x)-p(y)); if(S.sort==="desc") r=[...r].sort((x,y)=>p(y)-p(x)); return r; };
const fbar = () => `<div class="row" style="padding:4px 0">${CATS.map(c=>`<button data-a="fcat" data-t="${c[0]}" class="${S.cat===c[0]?"on":""}">${S.lang==="bn"?c[2]:c[1]}</button>`).join("")}</div><div class="row" style="padding:4px 0">${SORTS.map(c=>`<button data-a="fsort" data-t="${c[0]}" class="${S.sort===c[0]?"on":""}">${S.lang==="bn"?c[2]:c[1]}</button>`).join("")}</div>`;
const loadMore = () => S.items.length>=S.lim?`<button class="btn alt" data-a="more">${S.lang==="bn"?"আরও দেখুন":"Load more"}</button><br><br>`:"";
const pgrid = a => a.length ? `<div class="pg">${a.map(pcard).join("")}</div>` : "";
const ctx = () => ({S,esc,toast,render,t,pcard,pfilter,fbar});
const list = arr => arr.length ? arr.map(card).join("") : `<div class="empty">${t("none")}</div>`;
const match = i => (!S.q || (i.title+i.desc+i.area).toLowerCase().includes(S.q.toLowerCase()));

function home(){
  const sameA = i=>i.area?.toLowerCase()===S.area.toLowerCase();
  const prods = S.items.filter(i=>i.type==="product"&&match(i)).sort((a,b)=>sameA(b)-sameA(a));
  const near = S.items.filter(i=>i.type!=="product"&&sameA(i)&&match(i));
  return `<div class="hero"><div class="bar"><button class="ib" data-a="drawer" aria-label="${t("menu")}">☰</button><button class="chip" data-a="area">📍 ${esc(S.area)} ▾</button><span class="sp"></span></div>
  <h1>${t("hi")}, ${esc(S.user.displayName||"")}!</h1><div>${t("tag")}</div>
  <input class="search" id="q" placeholder="${t("search")}" value="${esc(S.q)}" aria-label="${t("search")}"></div>
  <div class="grid">${TYPES.map(r=>`<button class="tile" data-a="go" data-t="${r[0]}"><b>${r[1]}</b>${esc(tn(r))}</button>`).join("")}</div>
  <div class="sec"><h2>🛍 ${S.lang==="bn"?"জনপ্রিয় পণ্য":"Popular products"}</h2>${pgrid(prods.slice(0,12))||`<div class="empty">${t("none")}</div>`}${loadMore()}<h2>${t("nearby")}</h2>${near.length?near.slice(0,8).map(card).join(""):`<div class="empty">${t("none")}</div>`}</div>`;
}
function explore(){
  const f = S.items.filter(i=>(S.filter==="all"||i.type===S.filter)&&match(i));
  return `<div class="hero"><h1>${t("explore")}</h1><input class="search" id="q" placeholder="${t("search")}" value="${esc(S.q)}" aria-label="${t("search")}"></div>
  <div class="row"><button data-a="f" data-t="all" class="${S.filter==="all"?"on":""}">${t("all")}</button>${TYPES.map(r=>`<button data-a="f" data-t="${r[0]}" class="${S.filter===r[0]?"on":""}">${r[1]} ${esc(tn(r))}</button>`).join("")}</div>
  <div class="sec">${f.length?"":`<div class="empty">${t("none")}</div>`}${["all","product"].includes(S.filter)?fbar():""}${pgrid(pfilter(f.filter(i=>i.type==="product")))}${f.filter(i=>i.type!=="product").map(card).join("")}${loadMore()}</div>`;
}
function inbox(){
  return `<div class="hero"><h1>${t("inbox")}</h1></div><div class="sec" style="margin-top:12px">${S.notes.length?S.notes.map(n=>`<div class="card"><b>${esc(n.title)}</b><div>${esc(n.body)}</div></div>`).join(""):`<div class="empty">${t("nonot")}</div>`}</div>`;
}
function profile(){
  const mine = S.items.filter(i=>i.owner===S.user.uid);
  return `<div class="hero"><h1>${esc(S.user.displayName||"")}</h1><div>${esc(S.user.email)} ${S.user.emailVerified?"✔":""}</div></div>
  <div class="sec"><div class="card"><button class="btn alt" data-a="theme">${t("dark")}</button><br><br><button class="btn alt" data-a="lang">${t("lang")}</button><br><br><button class="btn" data-a="out">${t("out")}</button></div>
  <h2>❤ ${S.lang==="bn"?"সেভ করা":"Saved"}</h2>${pgrid(S.wishDocs)||`<div class="empty">${t("none")}</div>`}<h2>${t("mine")}</h2>${list(mine)}</div>`;
}
function authView(){
  const su = S.authMode==="signup";
  return `<div class="auth"><h1 style="font-size:34px">MAVYQO</h1><p>${t("tag")}</p>
  ${su?`<label for="n">${t("name")}</label><input id="n" autocomplete="name">`:""}
  <label for="e">${t("email")}</label><input id="e" type="email" autocomplete="email">
  <label for="p">${t("pass")}</label><input id="p" type="password" autocomplete="${su?"new-password":"current-password"}">
  <div class="err" role="alert">${esc(S.err)}</div><br>
  <button class="btn" data-a="auth">${su?t("signup"):t("login")}</button><br><br>
  <button class="btn alt" data-a="mode">${su?t("login"):t("signup")}</button><br><br><button class="btn alt" data-a="lang">${t("lang")}</button></div>`;
}
function overlay(){
  const E = S.ov?.edit ? S.items.find(i=>i.id===S.ov.edit) : null;
  if(S.ov?.view){
    const i = byId(S.ov.view); if(!i){ S.ov=null; return ""; }
    const mine = i.owner===S.user.uid;
    return `<div class="ov" data-a="close"><div class="sheet" role="dialog">${X.safeImg(i.img)?`<img src="${esc(X.tr(i.img,800))}" alt="" style="width:100%;border-radius:14px">`:""}<div style="font-size:24px;font-weight:700;color:var(--blue);margin-top:8px">${i.price?`৳${esc(i.price)}`:""}</div><h3>${esc(i.title)}</h3><p>${esc(i.desc)}</p><small>📍 ${esc(i.area)} · ${esc(i.ownerName)}</small>${S.rev[i.owner]?.n?`<div>⭐ ${S.rev[i.owner].avg.toFixed(1)} (${S.rev[i.owner].n})</div>${S.rev[i.owner].list.map(r=>`<small style="display:block">★${r.rating} ${esc(r.text)}</small>`).join("")}`:""}<br><br>${mine?`<button class="btn alt" data-a="edit" data-id="${i.id}">✏️ Edit</button><br><br><button class="btn alt" data-a="del" data-id="${i.id}">🗑 Delete</button>`:`${i.type==="product"&&parseFloat(i.price)>0?`<button class="btn" data-a="x:market:add" data-id="${i.id}">🛒 ${S.lang==="bn"?"কার্টে যোগ করুন":"Add to cart"}</button><br><br>`:""}<button class="btn alt" data-a="x:chat:start" data-o="${esc(i.owner)}" data-n="${esc(i.ownerName)}" data-l="${i.id}" data-lt="${esc(i.title)}" data-li="${esc(i.img||"")}" data-lp="${esc(i.price||"")}">💬 ${S.lang==="bn"?"বিক্রেতাকে মেসেজ":"Message seller"}</button><br><br><button class="btn alt" data-a="rep" data-id="${i.id}">⚑ Report</button>`}</div></div>`;
  }
  if(S.ov==="create") return `<div class="ov" data-a="close"><div class="sheet" role="dialog"><h3>${t("create")}</h3>${CREATE.map(r=>`<button class="it" data-a="new" data-t="${r[0]}">${icon(r[0])} ${S.lang==="bn"?r[2]:r[1]}</button>`).join("")}</div></div>`;
  if(S.ov==="area") return `<div class="ov" data-a="close"><div class="sheet" role="dialog"><h3>${t("loc")}</h3><input id="ar" placeholder="${t("ph")}" value="${esc(S.area)}"><br><br><button class="btn" data-a="setarea">OK</button></div></div>`;
  if(S.ov?.form) return `<div class="ov"><div class="sheet" role="dialog"><h3>${icon(S.ov.form)} ${esc(label(S.ov.form))}</h3>
  <label for="ty">${t("type")}</label><select id="ty">${TYPES.map(r=>`<option value="${r[0]}" ${r[0]===S.ov.form?"selected":""}>${esc(tn(r))}</option>`).join("")}</select>
  <label for="ct">Category</label><select id="ct">${CATS.slice(1).map(c=>`<option value="${c[0]}" ${(E?.cat||"other")===c[0]?"selected":""}>${esc(S.lang==="bn"?c[2]:c[1])}</option>`).join("")}</select><label for="ti">${t("title")}</label><input id="ti" maxlength="120" value="${esc(E?.title)}"><label for="de">${t("desc")}</label><textarea id="de" rows="3" maxlength="800">${esc(E?.desc)}</textarea>
  <label for="ae">${t("area")}</label><input id="ae" value="${esc(E?.area||S.area)}" maxlength="80"><label for="pr">${t("price")}</label><input id="pr" maxlength="40" value="${esc(E?.price)}"><label for="im">Photo ${E?"(leave empty to keep current)":"(optional)"}</label><input id="im" type="file" accept="image/*"><label><input type="checkbox" id="pin" style="width:auto"> Pin my approximate location on the map</label>
  <div class="err" role="alert">${esc(S.err)}</div><br><button class="btn" data-a="pub">${t("publish")}</button><br><br><button class="btn alt" data-a="close">${t("cancel")}</button></div></div>`;
  return "";
}
function drawer(){
  const items = [["home","🏠",t("home")],["explore","🧭",t("explore")],...TYPES.filter(r=>r[0]!=="problem").map(r=>[r[0],r[1],tn(r)]),...Object.entries(X.views).map(([k,v])=>[k,v.icon,v.label[S.lang==="bn"?1:0]])];
  return `<div class="ov" data-a="close" style="align-items:stretch;justify-content:flex-start"><div class="drawer"><h2 style="margin-bottom:2px">MAVYQO</h2><small>${t("tag")}</small><br><br>
  ${items.map(i=>`<button data-a="dgo" data-t="${i[0]}">${i[1]} ${esc(i[2])}</button>`).join("")}<hr style="opacity:.2;margin:10px 0">
  <button data-a="theme">🌓 ${t("dark")}</button><button data-a="lang">🌐 ${t("lang")}</button><button data-a="out">🚪 ${t("out")}</button><p style="opacity:.7;font-size:13px;padding:8px">${t("about")}</p></div></div>`;
}
function render(){
  document.documentElement.dataset.theme = S.theme; document.documentElement.lang = S.lang;
  const app = $("#app");
  if(!S.user){ app.innerHTML = authView(); return; }
  const ext = X.views[S.tab]; const v = ext ? ext.render(ctx()) : {home,explore,inbox,profile}[S.tab]();
  const nb = (k,i)=>`<button data-a="tab" data-t="${k}" class="${S.tab===k?"on":""}"><span style="font-size:20px">${i}</span>${t(k)}</button>`;
  app.innerHTML = v + (ext?.full?.()?"":`<nav>${nb("home","🏠")}${nb("explore","🧭")}<button class="plus" data-a="create" aria-label="${t("create")}">+</button>${nb("inbox","💬")}${nb("profile","👤")}</nav>`) + (S.ov==="drawer"?drawer():overlay());
  if(ext?.after) ext.after(ctx()); const q = $("#q"); if(q){ q.oninput = e=>{ S.q=e.target.value; clearTimeout(S._d); S._d=setTimeout(()=>{ const p=e.target.selectionStart; render(); const n=$("#q"); n.focus(); n.setSelectionRange(p,p); },250); }; }
}

document.addEventListener("click", async e=>{
  const el = e.target.closest("[data-a]"); if(!el) return;
  if(el.classList.contains("ov") && e.target!==el) return;
  const a=el.dataset.a, ty=el.dataset.t;
  if(a.startsWith("x:")){ const [,mod,act]=a.split(":"); try{ if(await X.views[mod].on(act,el,ctx())==="skip") return; }catch(x){ toast(x.message||x.code||"Error"); } render(); return; }
  if(a==="tab"){ S.tab=ty; S.ov=null; }
  else if(a==="go"){ S.tab="explore"; S.filter=ty; }
  else if(a==="dgo"){ S.ov=null; if(X.views[ty]){ S.tab=ty; try{ await X.views[ty].init?.(ctx()); }catch(x){ toast(x.code||"Load failed"); } } else if(["home","explore"].includes(ty)){S.tab=ty;S.filter="all";} else {S.tab="explore";S.filter=ty;} }
  else if(a==="f") S.filter=ty;
  else if(a==="drawer") S.ov="drawer";
  else if(a==="create") S.ov="create";
  else if(a==="area") S.ov="area";
  else if(a==="close") S.ov=null;
  else if(a==="new"){ S.ov={form:ty}; S.err=""; }
  else if(a==="setarea"){ S.area=$("#ar").value.trim()||S.area; localStorage.area=S.area; S.ov=null; }
  else if(a==="theme"){ S.theme=S.theme==="dark"?"light":"dark"; localStorage.theme=S.theme; }
  else if(a==="lang"){ S.lang=S.lang==="en"?"bn":"en"; localStorage.lang=S.lang; }
  else if(a==="mode"){ S.authMode=S.authMode==="login"?"signup":"login"; S.err=""; }
  else if(a==="out"){ S.ov=null; await signOut(auth); return; }
  else if(a==="auth"){
    const em=$("#e").value.trim(), pw=$("#p").value;
    try{
      if(S.authMode==="signup"){
        const nm=$("#n").value.trim(); if(!nm){ S.err=t("name"); return render(); }
        const c = await createUserWithEmailAndPassword(auth,em,pw); await updateProfile(c.user,{displayName:nm});
        await setDoc(doc(db,"users",c.user.uid),{name:nm,email:em,role:"user",createdAt:serverTimestamp()});
        await sendEmailVerification(c.user); toast(t("sent"));
      } else await signInWithEmailAndPassword(auth,em,pw);
      S.err="";
    }catch(x){ S.err=x.code?.replace("auth/","").replaceAll("-"," ")||"Error"; render(); } return;
  }
  else if(a==="view"){ S.ov={view:el.dataset.id}; render(); await loadRev(byId(el.dataset.id)?.owner); }
  else if(a==="fcat") S.cat=ty;
  else if(a==="fsort") S.sort=ty;
  else if(a==="more"){ S.lim+=40; await load(); return; }
  else if(a==="wish"){
    const i=byId(el.dataset.id); if(i){ const ref=doc(db,"users",S.user.uid,"wishlist",i.id);
      try{
        if(S.wish.has(i.id)){ await deleteDoc(ref); S.wish.delete(i.id); S.wishDocs=S.wishDocs.filter(x=>x.id!==i.id); }
        else { const d={title:i.title,price:i.price||"",img:i.img||"",area:i.area||"",owner:i.owner||"",ownerName:i.ownerName||"",type:i.type,savedAt:serverTimestamp()}; await setDoc(ref,d); S.wish.add(i.id); S.wishDocs.push({id:i.id,...d}); }
      }catch(x){ toast(x.code||"Error"); } }
  }
  else if(a==="rep"){
    const i=byId(el.dataset.id), r=prompt(S.lang==="bn"?"কেন রিপোর্ট করছেন?":"Why are you reporting this?");
    if(i&&r){ try{ await addDoc(collection(db,"reports"),{by:S.user.uid,kind:"listing",target:i.id,targetUser:i.owner||"",reason:r.slice(0,300),status:"open",createdAt:serverTimestamp()}); toast("Report sent"); }catch(x){ toast(x.code||"Error"); } }
  }
  else if(a==="edit"){ const i=S.items.find(x=>x.id===el.dataset.id); if(i){ S.ov={form:i.type,edit:i.id}; S.err=""; } }
  else if(a==="del"){
    if(confirm(S.lang==="bn"?"পোস্টটি মুছে ফেলবেন?":"Delete this post?")){
      try{ await deleteDoc(doc(db,"listings",el.dataset.id)); S.ov=null; toast(S.lang==="bn"?"মুছে ফেলা হয়েছে":"Deleted"); await load(); return; }catch(x){ toast(x.code||"Error"); }
    }
  }
  else if(a==="pub"){
    if(!S.user.emailVerified){ await S.user.reload(); if(!S.user.emailVerified){ S.err=t("verify"); return render(); } }
    const ed=S.ov.edit;
    const f0={cat:$("#ct").value,type:$("#ty").value,title:$("#ti").value.trim(),desc:$("#de").value.trim(),area:$("#ae").value.trim(),price:$("#pr").value.trim()};
    if(!f0.title||!f0.area){ S.err=`${t("title")}, ${t("area")}`; return render(); }
    if(X.hasPhone(f0.title+"|"+f0.desc)){ S.err="Phone numbers can't be posted publicly. Buyers contact you through chat."; return render(); }
    let img="",lat=null,lng=null;
    try{ const f=$("#im").files[0]; if(f) img=await X.uploadImage(f); if($("#pin").checked){ const p=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no)); lat=+p.coords.latitude.toFixed(3); lng=+p.coords.longitude.toFixed(3); } }catch(x){ S.err=x.message||"Error"; return render(); }
    const extra={...(img?{img}:{}),...(lat!==null?{lat,lng}:{})};
    try{
      if(ed) await updateDoc(doc(db,"listings",ed),{...f0,...extra});
      else await addDoc(collection(db,"listings"),{...f0,...extra,owner:S.user.uid,ownerName:S.user.displayName||"",status:"active",createdAt:serverTimestamp()});
      S.ov=null; toast(t("published")); await load(); return;
    }catch(x){ S.err=x.code||"Error"; return render(); }
  }
  render();
});
onAuthStateChanged(auth, u=>{ S.user=u; S.tab="home"; if(u) load(); else render(); });
render();
</script>
</body>
</html>
