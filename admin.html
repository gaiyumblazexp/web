<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZYVORA অ্যাডমিন</title><meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
<style>body{background:#e9edf8}.top{border-radius:0;position:static}.nidg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.nidg img{width:100%;border-radius:10px;cursor:zoom-in;border:1px solid var(--line)}.stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.stat div{background:#fff;border-radius:14px;padding:10px 16px;border:1px solid var(--line)}.stat b{font-size:22px;color:var(--b);display:block}main{padding-bottom:40px}</style></head>
<body><div id="app"></div><div id="modal"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js"></script>
<script src="core.js"></script>
<script>
let me=null,A='nid',cnt={};
const TABS=[['nid','🪪 NID যাচাই'],['workers','✅ কর্মী অনুমোদন'],['products','🛍️ ফ্ল্যাগড পণ্য'],['reports','🚩 অভিযোগ'],['users','👥 ব্যবহারকারী'],['reviews','⭐ রিভিউ']];
auth.onAuthStateChanged(async u=>{me=null;if(!u)return $('#app').innerHTML=`<div class=auth><div class=abox><h2 style="margin-bottom:12px">ZYVORA অ্যাডমিন লগইন</h2><label>ইমেইল</label><input id=em type=email><label>পাসওয়ার্ড</label><input id=pw type=password><button class="btn p" style="width:100%" onclick="auth.signInWithEmailAndPassword(v('em'),v('pw')).catch(err)">প্রবেশ করুন</button></div></div>`;
 try{const s=await db.collection('users').doc(u.uid).get();if(s.data()?.role!='admin'){$('#app').innerHTML=`<div class=center><div><h2>অনুমতি নেই</h2><p>এই অ্যাকাউন্ট অ্যাডমিন নয়।</p><br><button class=btn onclick="auth.signOut()">বের হন</button></div></div>`;return}me=u;shell();show()}catch(x){err(x)}});
function shell(){$('#app').innerHTML=`<header class=top><div class=row1><span class=brand><img src="icon-192.png" alt="">ZYVORA অ্যাডমিন</span><span class=row><a class="btn s g" href="index.html" style="text-decoration:none">অ্যাপ</a><button class="btn s g" onclick="auth.signOut()">বের হন</button></span></div></header><main><div id=st class=stat></div><div class=sub id=tb></div><div id=l class=grid>লোড হচ্ছে…</div></main>`}
const C=n=>db.collection(n),done=()=>{toast('সম্পন্ন ✓');show()};
async function show(){if(!me)return;$('#tb').innerHTML=TABS.map(t=>`<button class="${A==t[0]?'on':''}" onclick="A='${t[0]}';show()">${t[1]}${cnt[t[0]]?` (${bn(cnt[t[0]])})`:''}</button>`).join('');
 try{const q=[['nid',C('workers').where('nidStatus','==','pending')],['workers',C('workers').where('nidStatus','==','approved').where('status','==','pending')],['products',C('products').where('status','==','flagged')]];
 for(const[k,x]of q)cnt[k]=(await x.get()).size;$('#st').innerHTML=`<div><b>${bn(cnt.nid)}</b>NID যাচাই বাকি</div><div><b>${bn(cnt.workers)}</b>অনুমোদন বাকি</div><div><b>${bn(cnt.products)}</b>ফ্ল্যাগড পণ্য</div>`;
 $('#tb').innerHTML=TABS.map(t=>`<button class="${A==t[0]?'on':''}" onclick="A='${t[0]}';show()">${t[1]}${cnt[t[0]]?` (${bn(cnt[t[0]])})`:''}</button>`).join('');
 let h='';
 if(A=='nid'){const d=docs(await q[0][1].get());for(const w of d){const n=(await C('nid').doc(w.id).get()).data()||{};h+=`<div class=card><h3>${e(w.fullName)}</h3><p>NID: <b>${e(w.nid)}</b><br>জন্ম: ${e(w.dob)} · ধরন: ${e(w.type)}<br>ঠিকানা: ${e(w.address)}<br>এলাকা: ${e(w.area)}<br>জরুরি: ${e(w.emergency)}</p><div class=nidg>${[n.front,n.back,n.selfie].map(s=>s?`<img src="${safe(s)}" onclick="zoom(this.src)">`:'').join('')}</div><p class=meta>ছবির নম্বরের সাথে NID নম্বর ও নাম মিলিয়ে নিন।</p><div class=row><button class="btn s ok" onclick="nidSet('${w.id}','approved')">NID সঠিক</button><button class="btn s r" onclick="nidSet('${w.id}','rejected')">NID ভুল/বাতিল</button></div></div>`}}
 if(A=='workers'){const d=docs(await q[1][1].get());h=d.map(w=>`<div class=card><h3>${e(w.fullName)} <span class="tag o">NID ✓</span></h3><p>ধরন: ${e(w.type)} · এলাকা: ${e(w.area)}<br>ঠিকানা: ${e(w.address)}</p><div class=row><button class="btn s ok" onclick="wSet('${w.id}','approved')">কর্মী হিসেবে অনুমোদন</button><button class="btn s r" onclick="wSet('${w.id}','rejected')">বাতিল</button></div></div>`).join('')}
 if(A=='products'){const d=docs(await q[2][1].get());h=d.map(p=>`<div class="card warn">${gal(p.imgs)}<h3>${e(p.title)}</h3><span class=price>৳${bn(p.price)}</span><p>${e(p.desc)}</p><span class="tag x">${e((p.flags||[]).join(', '))}</span><div class=meta>${e(p.sellerName)} · ${e(p.area)}</div><div class=row><button class="btn s ok" onclick="pSet('${p.id}','approved')">প্রকাশ করুন</button><button class="btn s r" onclick="pSet('${p.id}','rejected')">বাতিল</button></div></div>`).join('')}
 if(A=='reports'){h=docs(await C('reports').limit(80).get()).map(r=>`<div class=card><span class="tag x">${e(r.type)}</span><b>${e(r.reason)}</b><p>${e(r.detail)}</p><div class=meta>রিপোর্টকারী: ${e(r.byName)} · ${ago(r.createdAt)}</div><div class=row><button class="btn s r" onclick="ban('${r.targetUid}',true)">অভিযুক্তকে ব্যান</button><button class="btn s g" onclick="del('reports','${r.id}')">খারিজ</button></div></div>`).join('')}
 if(A=='users'){h=docs(await C('users').limit(200).get()).map(u=>{const risk=u.complaints>=3||(u.ratingCount>=3&&u.ratingSum/u.ratingCount<2.5);return `<div class="card ${risk?'warn':''}"><b>${e(u.name)}</b><div class=meta>${e(u.phone)} · ${e(u.area)}</div><div class=row><span class=tag>রেটিং ${bn(avg(u))}</span><span class="tag ${u.complaints>=3?'x':''}">অভিযোগ ${bn(u.complaints||0)}</span>${u.workerStatus=='approved'?'<span class="tag o">কর্মী</span>':''}${u.banned?'<span class="tag b">ব্যান</span>':''}${risk?'<span class="tag x">ঝুঁকিপূর্ণ</span>':''}</div>${u.role=='admin'?'':`<button class="btn s ${u.banned?'g':'r'}" onclick="ban('${u.id}',${!u.banned})">${u.banned?'ব্যান তুলুন':'ব্যান করুন'}</button>`}</div>`}).join('')}
 if(A=='reviews'){h=docs(await C('reviews').limit(100).get()).map(r=>`<div class=card><b>${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</b><p>${e(r.text)||'—'}</p><div class=meta>${e(r.byName)} · কর্মী আইডি: ${e(r.workerId.slice(0,6))}… · ${ago(r.createdAt)}</div><button class=lnk onclick="del('reviews','${r.id}')">মুছুন</button></div>`).join('')}
 $('#l').innerHTML=h||'<div class=empty>এখানে কিছু নেই।</div>'}catch(x){err(x)}}
const nidSet=(id,s)=>C('workers').doc(id).update({nidStatus:s}).then(()=>s=='rejected'?C('users').doc(id).update({workerStatus:'rejected'}):0).then(done).catch(err);
const wSet=(id,s)=>C('workers').doc(id).update({status:s}).then(()=>C('users').doc(id).update({workerStatus:s})).then(done).catch(err);
const pSet=(id,s)=>C('products').doc(id).update({status:s}).then(done).catch(err);
const ban=(id,b)=>confirm(b?'ব্যান করবেন?':'ব্যান তুলবেন?')&&C('users').doc(id).update({banned:b,free:false}).then(done).catch(err);
const del=(c,id)=>C(c).doc(id).delete().then(done).catch(err);
</script></body></html>
