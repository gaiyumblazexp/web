<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAVYQO Admin</title>
<style>*{box-sizing:border-box;margin:0}body{font-family:system-ui,sans-serif;background:#0d1230;color:#e8ecff}
header{display:flex;gap:8px;align-items:center;padding:14px 18px;background:linear-gradient(90deg,#1b2bb8,#7b3fe4);flex-wrap:wrap}header b{font-size:20px;margin-right:auto}
button{border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font:600 14px system-ui;background:#24307a;color:#fff}button.on{background:#fff;color:#1b2bb8}
.ok{background:#12915a}.no{background:#c0392b}main{padding:16px;max-width:980px;margin:auto}
.c{background:#161d4a;border-radius:14px;padding:14px;margin-bottom:12px}.c img{height:130px;border-radius:8px;margin:6px 6px 0 0}
.r{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}small{color:#9aa6e8}input{padding:10px;border-radius:10px;border:0;margin:4px;width:240px}.fl{color:#ffb454;font-weight:700}</style></head><body>
<header><b>MAVYQO · Admin</b><span id=tb></span><button data-a=out>Log out</button></header><main id=v></main>
<script type=module>
import{auth,db,A,F,$,esc}from'./core.js';
let tab='workers';const TB=['workers','posts','reviews','reports','users'];
const all=n=>F.getDocs(F.collection(db,n)).then(s=>s.docs.map(d=>({id:d.id,...d.data()})));
const up=(c,i,d)=>F.updateDoc(F.doc(db,c,i),d);
const btn=(a,v,l,c='')=>`<button class="${c}" data-a=${a} data-v="${v}">${l}</button>`;
A.onAuthStateChanged(auth,async u=>{if(!u)return $('#v').innerHTML='<div class=c><form id=lf><input name=e type=email placeholder=Email required><input name=p type=password placeholder=Password required><button>Log in</button></form></div>';
 const m=await F.getDoc(F.doc(db,'users',u.uid));if(!m.data()?.admin){$('#v').innerHTML='<div class=c>Access denied. Set admin:true on users/'+u.uid+' in Firestore.</div>';return}
 $('#tb').innerHTML=TB.map(x=>`<button data-a=tab data-v=${x}>${x}</button>`).join('');render()});
async function render(){document.querySelectorAll('#tb button').forEach(b=>b.className=b.dataset.v==tab?'on':'');let h='';
 if(tab=='workers'){const[w,k]=await Promise.all([all('workers'),all('kyc')]);w.sort((a,b)=>(a.status=='pending'?0:1)-(b.status=='pending'?0:1));
  h=w.map(x=>{const y=k.find(z=>z.id==x.id)||{},low=x.rc>=3&&x.rs/x.rc<2;return`<div class=c><b>${esc(x.name)}</b> · ${esc(x.cat)} · ${esc(x.area)} · <b>${x.status}</b> ${x.rc?`⭐${(x.rs/x.rc).toFixed(1)} (${x.rc})`:''} ${low?'<span class=fl>LOW RATING</span>':''}<p>${esc(x.bio)} · ${esc(x.phone)}</p><small>NID: ${esc(y.nid)}</small><div>${y.nidImg?`<img src="${esc(y.nidImg)}">`:''}${y.selfie?`<img src="${esc(y.selfie)}">`:''}</div><div class=r>${btn('ws',x.id+':approved','Approve','ok')}${btn('ws',x.id+':rejected','Reject')}${btn('ban',x.id,'Ban','no')}</div></div>`}).join('')}
 if(tab=='posts'){const p=await all('posts');p.sort((a,b)=>(a.status=='pending'?0:1)-(b.status=='pending'?0:1));h=p.map(x=>`<div class=c><b>${esc(x.title)}</b> · ${x.type} · ${esc(x.area)} · <b>${x.status}</b><p>${esc(x.desc)}</p><div>${(x.imgs||[]).map(s=>`<img src="${esc(s)}">`).join('')}</div><small>${esc(x.uname)}</small><div class=r>${btn('ps',x.id+':approved','Approve','ok')}${btn('ps',x.id+':rejected','Reject')}${btn('dp',x.id,'Delete','no')}</div></div>`).join('')}
 if(tab=='reviews')h=(await all('reviews')).map(x=>`<div class=c>⭐${x.r} by ${esc(x.name)} → ${esc(x.t)}<p>${esc(x.x)}</p>${btn('dr',x.id,'Delete','no')}</div>`).join('');
 if(tab=='reports'){const r=await all('reports'),n={};r.forEach(x=>n[x.t]=(n[x.t]||0)+1);h=r.map(x=>`<div class=c><b>${esc(x.t)}</b> (${n[x.t]} reports) <p>${esc(x.x)}</p><div class=r>${x.t[0]=='w'?btn('ban',x.t.slice(2),'Ban user','no'):btn('dp',x.t.slice(2),'Delete post','no')}${btn('dx',x.id,'Dismiss')}</div></div>`).join('')}
 if(tab=='users')h=(await all('users')).map(x=>`<div class=c>${esc(x.name)} · ${esc(x.area)} ${x.banned?'<b class=fl>BANNED</b>':''}<div class=r>${x.banned?btn('unban',x.id,'Unban','ok'):btn('ban',x.id,'Ban','no')}</div></div>`).join('');
 $('#v').innerHTML=h||'<div class=c>Nothing here.</div>'}
const act={tab:v=>{tab=v;render()},out:()=>A.signOut(auth),
 ws:async v=>{const[i,s]=v.split(':');await up('workers',i,{status:s});render()},ps:async v=>{const[i,s]=v.split(':');await up('posts',i,{status:s});render()},
 dp:async v=>{await F.deleteDoc(F.doc(db,'posts',v));render()},dr:async v=>{await F.deleteDoc(F.doc(db,'reviews',v));render()},dx:async v=>{await F.deleteDoc(F.doc(db,'reports',v));render()},
 ban:async v=>{await up('users',v,{banned:true});try{await up('workers',v,{status:'banned',free:false})}catch{}render()},unban:async v=>{await up('users',v,{banned:false});render()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act[b.dataset.a](b.dataset.v)});
document.addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await A.signInWithEmailAndPassword(auth,d.e,d.p)}catch(x){alert(x.code)}});
</script></body></html>
